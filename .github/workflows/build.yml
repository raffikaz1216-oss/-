
name: Build KyushuRealScale MOD

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build MOD
        working-directory: "KyushuRealScale 2"
        run: gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: KyushuRealScale-JAR
          path: "KyushuRealScale 2/build/libs/*.jar"
